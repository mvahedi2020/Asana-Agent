name: Reject tracked runtime files
on: [push, pull_request]
permissions: { contents: read }
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          blocked="$(git ls-files | awk '/(^|\/)\.(next|vercel)\// {print; next} /(^|\/)\.env($|\.)/ && !/\.env\.example$/ {print}')"
          test -z "$blocked" || { echo "$blocked"; exit 1; }
